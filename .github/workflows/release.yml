name: SENTINEL Enterprise V1.1 release

on:
  workflow_dispatch:
  push:
    branches: ['v1.1-development']
    tags: ['v1.1.0']

permissions:
  contents: read

concurrency:
  group: sentinel-v1-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Locate NSIS
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $makensis)) { throw 'makensis.exe is unavailable.' }
          "SENTINEL_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify native Windows PowerShell helper path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'installer/helpers/Prepare-Sentinel.ps1'
          $hostPath = Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          foreach ($dependency in @($helper, $hostPath)) {
            Write-Host "Native helper preflight dependency: $dependency"
            if (-not (Test-Path -LiteralPath $dependency -PathType Leaf)) {
              throw "Missing native helper preflight dependency: $dependency"
            }
          }
          $hostProbe = 'if (-not [Environment]::Is64BitProcess) { throw "Expected native 64-bit Windows PowerShell." }; [Console]::WriteLine("Native helper host: Is64BitProcess=" + [Environment]::Is64BitProcess + "; ProgramFiles=" + [Environment]::GetFolderPath("ProgramFiles"))'
          $encodedProbe = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($hostProbe))
          & $hostPath -NoProfile -NonInteractive -EncodedCommand $encodedProbe
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows PowerShell host verification failed.' }
          $probeDirectory = Join-Path ${env:ProgramW6432} 'SENTINEL-Installer-Path-Preflight'
          if (Test-Path -LiteralPath $probeDirectory) { throw "Preflight directory already exists: $probeDirectory" }
          try {
            & $hostPath -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $helper -InstallationDirectory $probeDirectory
            if ($LASTEXITCODE -ne 0) { throw "Installer helper preflight failed with exit code $LASTEXITCODE; see the helper's error above." }
          } finally {
            if (Test-Path -LiteralPath $probeDirectory) { Remove-Item -LiteralPath $probeDirectory -Recurse -Force }
          }
      - name: Build Release, run product tests, publish self-contained x64 applications and package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/qa -Force | Out-Null
          Start-Transcript -Path artifacts/qa/package.log
          try {
            ./scripts/package.ps1 -Version '1.1.0' -Configuration Release -Makensis $env:SENTINEL_MAKENSIS
          } finally { Stop-Transcript }
      - name: Run engine regression tests
        shell: pwsh
        run: |
          Start-Transcript -Path artifacts/qa/engine-tests.log
          try {
            dotnet run --project tests/Sentinel.EngineTests/Sentinel.EngineTests.csproj --no-build -c Release
            if ($LASTEXITCODE -ne 0) { throw "Engine regression tests failed with exit code $LASTEXITCODE." }
          } finally { Stop-Transcript }
      - name: Build QA-only installed upgrade probe
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'tests/Sentinel.UpgradeProbe/Sentinel.UpgradeProbe.csproj'
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/upgrade-probe'
          dotnet publish $project -c Release --self-contained false -o $output -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Installed upgrade probe build failed.' }
      - name: Download and verify immutable public V1.0 upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:GITHUB_WORKSPACE 'artifacts/v1.0-baseline'
          New-Item -ItemType Directory -Path $baseline -Force | Out-Null
          gh release download v1.0.0 --pattern SENTINEL-Enterprise-V1.0-Setup-x64.exe --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the actual historical V1.0 installer. Upgrade gate cannot be replaced with a current-source approximation.' }
          $setup = Join-Path $baseline 'SENTINEL-Enterprise-V1.0-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Historical V1.0 installer is missing.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '13b2d877223657b604c7607179afe91b151d8331308ddc8f299378da50b64ad2'
          Write-Host "Public V1.0 installer: $setup; SHA-256: $hash"
          if ($hash -ne $expected) { throw 'The historical public V1.0 installer changed. Refusing to continue the upgrade gate.' }
      - name: Test release publication safeguards
        shell: pwsh
        run: |
          python -m unittest discover -s tests/Sentinel.ReleaseTests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication regression tests failed.' }
      - name: Installer, desktop first launch, service, upgrade and uninstall smoke tests
        shell: pwsh
        run: |
          Start-Transcript -Path artifacts/qa/windows-smoke.log
          try {
            $setup = Join-Path $env:GITHUB_WORKSPACE 'release/SENTINEL-Enterprise-V1.1/SENTINEL-Enterprise-V1.1-Setup-x64.exe'
            $baseline = Join-Path $env:GITHUB_WORKSPACE 'artifacts/v1.0-baseline/SENTINEL-Enterprise-V1.0-Setup-x64.exe'
            $probe = Join-Path $env:GITHUB_WORKSPACE 'artifacts/upgrade-probe/Sentinel.UpgradeProbe.dll'
            $desktopAcceptance = Join-Path $env:GITHUB_WORKSPACE 'scripts/verify-desktop.ps1'
            ./scripts/verify-windows.ps1 -SetupPath $setup -ExpectedVersion '1.1.0' -BaselineSetupPath $baseline -UpgradeProbePath $probe -DesktopAcceptanceScript $desktopAcceptance -InstallUninstall -DesktopSmoke
          } finally {
            try {
              $setupLog = Join-Path $env:TEMP 'SENTINEL-Setup.log'
              if (Test-Path -LiteralPath $setupLog -PathType Leaf) {
                Copy-Item -LiteralPath $setupLog -Destination (Join-Path $env:GITHUB_WORKSPACE 'artifacts/qa/SENTINEL-Setup.log') -ErrorAction Stop
                Write-Host "Installer helper diagnostics: $setupLog"
                Get-Content -LiteralPath $setupLog -ErrorAction Stop | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host "Installer helper diagnostic log was not created: $setupLog"
              }
            } catch {
              Write-Warning "Could not collect installer diagnostics: $($_.Exception.Message)" -WarningAction Continue
            } finally {
              try { Stop-Transcript -ErrorAction Stop }
              catch { Write-Warning "Could not stop diagnostic transcript: $($_.Exception.Message)" -WarningAction Continue }
            }
          }
      - name: Prepare distributables and verify ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distribution = Join-Path $env:GITHUB_WORKSPACE 'artifacts/distribution/SENTINEL-Enterprise-V1.1'
          $package = Join-Path $env:GITHUB_WORKSPACE 'release/SENTINEL-Enterprise-V1.1'
          New-Item -ItemType Directory -Path $distribution -Force | Out-Null
          $exeName = 'SENTINEL-Enterprise-V1.1-Setup-x64.exe'
          $zipName = 'SENTINEL-Enterprise-V1.1-Installer.zip'
          $exe = Join-Path $distribution $exeName
          Copy-Item -LiteralPath (Join-Path $package $exeName) -Destination $exe
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSize = (Get-Item -LiteralPath $exe).Length
          $readme = @"
          SENTINEL Enterprise V1.1 - unsigned Windows 10/11 x64 testing installer

          INSTALLER: $exeName
          SIZE: $exeSize bytes
          SHA-256: $exeHash
          SOURCE COMMIT: $env:GITHUB_SHA

          Download the EXE, double-click Setup, and approve the administrator/UAC request.
          Launch SENTINEL Enterprise from the Start Menu and select Demo Organization.
          The synthetic demo works offline and requires no company network.

          Setup includes the desktop application, least-privilege maintenance service,
          self-contained .NET/WPF runtime, native SQLite, shortcuts, and uninstaller.
          Visual Studio, source code, Docker, Node.js, an external database server,
          and a separately installed .NET runtime are not required.

          The CI Release build, product and engine tests, installed WPF functional/rendered
          acceptance, and Windows installer/service/first-launch/uninstall checks passed.
          Upgrade from the actual public V1.0 installer preserved evidence, preferences,
          history, audit records, maintenance settings, and user-bound DPAPI data.
          Physical Windows 10/11 and native display scaling acceptance remain required.
          This unsigned testing prerelease is not a fully accepted production release.
          The maintenance service does not autonomously scan networks.

          This package was built in GitHub Actions. Byte-for-byte reproducibility
          against an earlier installer is not guaranteed; use this package's hashes.
          Uninstall preserves operator evidence in LocalAppData/Sentinel and service
          audit files in ProgramData/Sentinel.
          "@
          Set-Content -LiteralPath (Join-Path $distribution 'README.txt') -Value $readme -Encoding utf8
          $checksums = Join-Path $distribution 'SHA256SUMS.txt'
          Set-Content -LiteralPath $checksums -Value "$exeHash  $exeName" -Encoding ascii
          $zip = Join-Path $distribution $zipName
          Compress-Archive -LiteralPath @($exe, (Join-Path $distribution 'README.txt'), $checksums) -DestinationPath $zip
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $expected = @($exeName, 'README.txt', 'SHA256SUMS.txt') | Sort-Object
            $actual = @($archive.Entries | ForEach-Object FullName) | Sort-Object
            if (@(Compare-Object $expected $actual).Count -ne 0) { throw 'ZIP contains unexpected or missing files.' }
            $entry = $archive.GetEntry($exeName)
            $stream = $entry.Open()
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try {
              $embeddedHash = [Convert]::ToHexString($algorithm.ComputeHash($stream)).ToLowerInvariant()
            } finally { $algorithm.Dispose(); $stream.Dispose() }
            if ($embeddedHash -ne $exeHash) { throw 'ZIP installer hash does not match the standalone installer.' }
          } finally { $archive.Dispose() }
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # The ZIP checksum file covers its installer; the external file covers both binaries.
          Add-Content -LiteralPath $checksums -Value "$zipHash  $zipName" -Encoding ascii
          Copy-Item -LiteralPath (Join-Path $package 'release-manifest.json') -Destination $distribution
          $verification = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-verification'
          Copy-Item -LiteralPath (Join-Path $verification 'verification-results.json') -Destination $distribution
          Copy-Item -LiteralPath (Join-Path $verification 'desktop/verification-results.json') -Destination (Join-Path $distribution 'desktop-verification-results.json')
          @"
          ## SENTINEL Enterprise V1.1 distributables
          | File | Bytes | SHA-256 |
          | --- | ---: | --- |
          | $exeName | $exeSize | $exeHash |
          | $zipName | $((Get-Item -LiteralPath $zip).Length) | $zipHash |

          Download SENTINEL-Enterprise-V1.1-Windows-x64 from this run's Artifacts section.
          A successful v1.1.0 tag run also publishes and verifies GitHub Release assets.
          This CI build is unsigned. Installed UI/upgrade gates passed; physical Windows/native-DPI acceptance remains required.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload installer and distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-Enterprise-V1.1-Windows-x64
          path: artifacts/distribution/SENTINEL-Enterprise-V1.1/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload QA logs and evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-Enterprise-V1.1-QA
          path: |
            artifacts/qa/
            artifacts/windows-verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload compact visual review gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-Enterprise-V1.1-Visual-Preview
          path: |
            artifacts/windows-verification/desktop/screenshots/*-1366x768-effective-100pct.png
            artifacts/windows-verification/desktop/screenshots/*-selected.png
            artifacts/windows-verification/desktop/screenshots/*-breakpoint.png
            artifacts/windows-verification/desktop/screenshots/*-answer.png
            artifacts/windows-verification/desktop/screenshots/*-preview.png
            artifacts/windows-verification/desktop/screenshots/*-awaiting-evidence.png
            artifacts/windows-verification/desktop/screenshots/*authorization*.png
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.0'
    needs: windows-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SENTINEL-Enterprise-V1.1-Windows-x64
          path: distribution
      - name: Upload, verify downloaded assets, then publish the V1.1 testing prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SENTINEL_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish-release.py --directory distribution
